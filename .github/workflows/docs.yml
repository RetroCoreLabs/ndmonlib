# Build the MON call documentation site and publish it to GitHub Pages
# (https://retrocorelabs.github.io/ndmonlib/) on every push to main.
name: Documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install "mkdocs-material==9.6.21" pyyaml
      - name: Check registry status against handler sources
        run: python3 tools/generate_mon_status.py --check
      - name: Generate pages
        run: python3 tools/generate_mon_site.py
      - name: Build site
        run: mkdocs build --strict -f build-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
