# SINTRAN III Monitor Call: GetCurrentTime
# Octal: 113B
# Extracted from: Monitor Calls.md (ND-860228.2 EN)

octal: 113B
name: GetCurrentTime
short_names:
- CLOCK
description: |-
  Gets the current system time and date.

  - The current system time is returned as basic time units, seconds, minutes, hours, day, month, and year.
see_also:
- GetBasicTime
- AdjustClock
- SetClock
- and @DATCL
parameters:
- name: TimeBuffer
  type: ARRAY
  io: O
  description: |-
    Buffer to receive 7 integers containing:
    [0] = basic time units (1/50th second)
    [1] = seconds
    [2] = minutes
    [3] = hours
    [4] = day
    [5] = month
    [6] = year
examples:
  pascal:
    available: true
    code: |-
      TimeBuffer : record;
      ...
      GetCurrentTime(TimeBuffer);
  cobol:
    available: true
    code: |-
      01 TimeBuffer.
         02 array COMP OCCURS 7 TIMES.
         ...
      MONITOR-CALL "GetCurrentTime" USING TimeBuffer.
  fortran:
    available: true
    code: |-
      INTEGER TimeBuffer(7)
      ...
      Monitor_Call('GetCurrentTime', TimeBuffer(1))
  planc:
    available: true
    code: |-
      INTEGER ARRAY : TimeBuffer(0:6)
      ...
      Monitor_Call('GetCurrentTime', TimeBuffer(0))
  assembly_500:
    available: true
    code: |-
      TimeBuffer : W BLOCK 7
      GetCurrentTime : EQU 37B9 + 113B
      ...
      CALLG GetCurrentTime, 1, TimeBuffer
    octal_definition: 37B9 + 113B
  mac:
    available: true
    code: |-
      | Instruction | Parameter | Comment                                      |
      |-------------|-----------|----------------------------------------------|
      | LDA         | (PAR      | %Load register A with address of parameter list. |
      | MON         | 113       | %Monitor call GetCurrentTime.                 |
      | ...         |           |                                              |
      | PAR,        | CLOK      |                                              |
      | ...         |           |                                              |
      | CLOK, 0     |           | %Basic time units.                           |
      |             | 0         | %Seconds.                                    |
      |             | 0         | %Minutes.                                    |
      |             | 0         | %Hours.                                      |
      |             | 0         | %Day.                                        |
      |             | 0         | %Month.                                      |
      |             | 0         | %Year.                                       |



