  ocr_corrected: false
emulation:
  status: implemented
  nd500x_handler: nd500x/src/libmon/handlers/mon_120B_WriteToFile.c
  last_updated: '2026-07-17'

  parameter_notes:
    - name: BlockNo
      note: >-
        As in 117B RFILE: the manual field says "Use -1 to write to the next
        block", and the trap is the SIGN. BlockNo is a SIGNED halfword that
        callers sign-extend to a word (PLANC emits H WCONV), so -1 arrives as
        0xFFFFFFFF. Read unsigned it seeks past the end and every write fails.
        -1 must mean "resume at the recorded position, do not seek by block".
      verified: true
    - name: 'all INTEGER parameters'
      note: >-
        On ND-500 every INTEGER parameter is a 32-bit WORD ('W BLOCK' in the
        manual's assembly_500 examples), so nd500x reads all of them with word
        accessors.
      verified: true

  return_contract:
    success: 'K flag cleared; data flushed to the host file; file position advanced.'
    errors:
      - code: 85
        octal: 125B
        meaning: 'Not open for random write'
      - code: 87
        octal: 127B
        meaning: 'File number out of range'
      - code: 90
        octal: 132B
        meaning: 'No file opened with this number'
      - code: 97
        octal: 141B
        meaning: 'Transfer error (short host write)'
      - code: 99
        octal: 143B
        meaning: 'No such block (seek failed)'
      - code: 89
        octal: 131B
        meaning: 'No more buffer space'
      - code: 124
        octal: 174B
        meaning: 'Illegal parameter (file connected as segment; negative BlockNo other than -1; size over the cap)'

  verified:
    - claim: 'WriteToFile is illegal on a file connected as a segment.'
      evidence: >-
        The manual states it; the handler enforces it (entry->mapped_as_segment
        -> 174B).
    - claim: 'Writing past the recorded end extends the file.'
      evidence: >-
        The handler advances object_entry.bytes_in_file when the new position
        exceeds it, which is what 62B RMAX then reports.

  unverified:
    - >-
      ReturnFlag (the wait flag) is read and logged but has no effect - every
      write is synchronous and flushed. The non-zero "continue, then use
      AwaitFileTransfer" path is not modelled.
    - >-
      "The write operation must start at the beginning of a block" is not
      enforced.
    - >-
      Access code D (direct transfer) block-size/page-size constraints are not
      enforced.
    - >-
      "Peripheral files are always written sequentially" is not modelled.
    - >-
      nd500x caps a single write at 65536 bytes (MAX_WRITE_SIZE) and returns 174B
      above it. That cap is an emulator invention, not a documented SINTRAN
      limit.
    - >-
      Unlike 117B RFILE, this handler does NOT write a transferred-count back to
      NoOfBytes. Whether the real WFILE does a count write-back on a short write
      has not been carved - the 117B success path (006-S3FS worker 102130B,
      102433-102470) was carved but the WFILE counterpart was not.
    - >-
      WFILE's return contract has NOT been audited against the carve. The
      completeness matrix records it as MATCH from a manual-based reading only.

  sources:
    - doc: 'SINTRAN III Monitor Calls (ND-860228.2 EN)'
      note: 'The manual page this YAML was extracted from.'
    - doc: nd500x/docs/MON_COMPLETENESS_MATRIX.md
      note: 'Row 120B WFILE - "MATCH (prior)", manual-based.'
