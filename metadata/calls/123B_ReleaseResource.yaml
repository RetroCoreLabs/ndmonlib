  validated: false
  ocr_corrected: false
emulation:
  status: implemented
  nd500x_handler: nd500x/src/libmon/handlers/mon_123B_ReleaseResource.c
  last_updated: '2026-07-17'

  note: >-
    Real bookkeeping against the nd500x device-reservation table
    (mon_release_device in src/libmon/mon_file_table.c). The one hard-won fact:
    RELEASING AN UNRESERVED RESOURCE IS A SUCCESS, NOT AN ERROR.

  parameter_notes:
    - name: 'DeviceNumber / IOFlag'
      note: >-
        On ND-500 both INTEGER parameters are 32-bit words (W BLOCK), read with
        mon_read_param_word. IOFlag: 0 = input part, 1 = output part; one part
        per call.
      verified: true
    - name: '(none)'
      note: >-
        This call has NO out parameter - the result is only the K flag. Contrast
        122B RESRV, which does have a conditional Status output.
      verified: true

  return_contract:
    success: >-
      K flag cleared. Also returned for an idempotent release of a valid but
      unreserved resource.
    errors:
      - code: 111
        octal: 157B
        meaning: 'Missing parameter (fewer than 2 arguments supplied)'
      - code: 124
        octal: 174B
        meaning: >-
          Illegal parameter - genuinely bad input only (invalid device number, or
          an io_flag that is neither 0 nor 1).

  verified:
    - claim: 'MON 123B dispatches via MCTAB to the L07 worker RELES in segment 003-S3CP.'
      evidence: >-
        Carve L-VSX-500 123B-ReleaseResource/README.md: MCTAB slot (segment
        044-S3IDPIT, byte offset 1990) = 037156B = RELES; RELES worker body
        carved at 037156B-037162B in 003-S3CP (byte offset 7388). Reproduced:
        dd if=044-S3IDPIT.bin bs=1 skip=1990 count=2 -> 3e 6e.
    - claim: >-
        Releasing an unreserved (but valid) resource is an idempotent SUCCESS
        no-op, NOT error 005B.
      evidence: >-
        Carved L07 RELES worker. Recorded in the handler: "error 005B belongs to
        the I/O operations that REQUIRE a reservation, never to RELES itself."
        nd500x maps mon_release_device()'s -2 ("valid device, not reserved") to
        success.

  unverified:
    - >-
      The RELES worker body is only 5 words (037156B-037162B) and was not decoded
      instruction by instruction for this note; the idempotent-success claim is
      carried from the handler's citation of that carve, not re-derived here.
    - >-
      nd500x's internal return codes (0 released, -2 valid-but-unreserved, -1
      invalid device number, -52 invalid io_flag) are emulator-internal. -52 in
      particular is NOT a SINTRAN code - it is mapped to 124 (174B) before it
      reaches the guest. Whether real SINTRAN raises an error at all for a bad
      io_flag is unknown.
    - >-
      "CloseFile or @CLOSE-FILE releases reserved files" and "a normal
      termination of an RT program releases all resources" are not modelled.
    - >-
      Not yet audited against the carve - listed under "NOT yet audited vs carve"
      in nd500x/docs/HANDOFF_MON_COMPLETENESS.md.

  discrepancies:
    - was: >-
        nd500x previously returned error 5 (005B "Device not reserved") when a
        program released something it had not reserved. Commit 6b57202 lists
        RELES among the calls given "correct codes ... (device not reserved 5)".
      is: >-
        RELES itself returns SUCCESS for that case. 005B is raised by the I/O
        operations that REQUIRE a reservation, never by RELES.
      evidence: >-
        Carved L07 RELES worker, cited in
        nd500x/src/libmon/handlers/mon_123B_ReleaseResource.c
        lines 48-56.

  sources:
    - doc: 'NDInsight/tools/sintran-segment-carver/versions/L-VSX-500/re/mon-analysis/123B-ReleaseResource/README.md'
      note: 'MCTAB[123B] = RELES = 037156B, worker carved in 003-S3CP.'
    - doc: nd500x/docs/MON_CSHARP_SYNC_HANDOFF.md
      note: 'Cross-emulator sync notes.'
