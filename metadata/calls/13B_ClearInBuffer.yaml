emulation:
  status: stub
  nd500x_handler: nd500x/src/libmon/handlers/mon_13B_ClearInBuffer.c
  last_updated: '2026-07-17'

  stub_behaviour: >-
    SUCCESS NO-OP - SAY SO. 13B CIBUF returns success WITHOUT DISCARDING ANYTHING.
    Two reasons, both deliberate: (1) the emulator has no separate hardware
    type-ahead buffer to flush; (2) the queued-console input models the program's
    OWN SCRIPTED command stream, and clearing it would drop commands the program
    still intends to read. A guest that relies on CIBUF actually discarding
    type-ahead will NOT behave correctly here.

  observed_calls:
    - caller: 'ND linker (linker-b01.dom), startup'
      params:
        DeviceNumber: 'not recorded'
      expectation: >-
        Called during linker startup terminal configuration. The linker only needs
        it not to fail; the success no-op is enough for it to proceed.
      note: >-
        Before this handler existed the auto-generated stub returned error -1 and
        the linker crashed in startup device configuration. Commit 940ba39.

  return_contract:
    success: 'K flag cleared.'
    errors:
      - code: 111
        octal: 157B
        meaning: 'Missing parameter (no CALLG args)'

  verified:
    - claim: 'The linker proceeds past its startup with the success no-op.'
      evidence: >-
        Commit 940ba39: "13B CIBUF (ClearInBuffer): success no-op". The linker then
        advanced to MON 144B MAGTP. ctest 16/16 green, 58/58 MON unit tests.

  unverified:
    - >-
      THE CARVE WAS NOT MINED FOR THIS ENTRY. A carve folder exists at
      NDInsight/tools/sintran-segment-carver/versions/L-VSX-500/re/mon-analysis/013B-ClearInBuffer/
      and has NOT been read into this block. The real worker's semantics (which
      buffer, what it does to a pending break count, what it returns for a
      non-terminal device) are therefore unknown here.
    - >-
      nd500x ignores DeviceNumber entirely - it does not validate the device class
      and does not reject file numbers. Whether real CIBUF errors on a file number
      is unknown.

  sources:
    - doc: 'SINTRAN III Monitor Calls (ND-860228.2 EN)'
      note: 'The manual body of this YAML.'
