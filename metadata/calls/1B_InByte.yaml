      note: 'The write-side CR proof and the three-sentinel table (47B vs 015B vs -1). Do not conflate them.'
    - doc: NDInsight/tools/sintran-segment-carver/versions/L-VSX-500/re/mon-analysis/1B-InByte/README.md
      note: 'Dispatch carve (GOTAB[1B]=M1, MCTAB[1B]=YFGET).'
    - doc: nd500x/docs/HANDOFF_CSHARP_FILE_TABLE_SINTRAN_SEMANTICS.md
      note: 'ITEM 2 - device-0 CR termination, with the exact behaviours the C# side must match.'
    - doc: nd500x/docs/CSHARP_HANDOFF_BLOCKING_READ_SESSION.md
      note: 'The blocking-read model (STOP_WAIT_INPUT) and device-0 vs terminal.'
