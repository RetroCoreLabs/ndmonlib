# SINTRAN III Monitor Call: Out8Bytes
# Octal: 24B
# Extracted from: Monitor Calls.md (ND-860228.2 EN)

octal: 24B
name: Out8Bytes
short_names:
- B8OUT
description: |-
  Writes 8 bytes to a character device, e.g. a terminal. All 8 bytes are output. OutUpTo8Bytes stops if a byte is 0.

  - On the ND-500, you are advised to use the faster OutputString.
  - Appendix F contains an ASCII table.
see_also:
- OutUpTo8Bytes
- OutByte
- OutString
- OutputString
- OutMessage
- OutNumber
- and In8Bytes
parameters:
- name: DeviceNumber
  type: INTEGER
  io: I
  description: Logical device number. See appendix B.
- name: OutData
  type: STRING
  io: I
  description: Buffer containing 8 bytes to write.
examples:
  pascal:
    available: true
    code: |-
      DeviceNumber : INTEGER2;
      OutData : RECORD...END;
      ...
      Out8Bytes(DeviceNumber, OutData);
      IF ErrCode <> 0 THEN ...
  cobol:
    available: true
    code: |-
      01 DeviceNumber COMP.
      01 OutData PIC X(8).
      01 ErrCode COMP.
      ...
      MONITOR-CALL "Out8Bytes" USING DeviceNumber, OutData.
      CALL "CBerror" USING ErrCode.
      IF ErrCode NOT = 0 GO ...
  fortran:
    available: true
    code: |-
      INTEGER DeviceNumber
      CHARACTER OutData*8
      ...
      Monitor_Call('Out8Bytes', DeviceNumber, OutData(1:8))
      IF (ErrCode .NE. 0) THEN ...
  planc:
    available: true
    code: |-
      INTEGER : DeviceNumber
      BYTES : OutData(0:7)
      ...
      ON ROUTINEERROR DO
        IF ErrCode > 0 THEN ...
      ENDON
      Monitor_Call('Out8Bytes', DeviceNumber, OutData)
  assembly_500:
    available: true
    code: |-
      DeviceNumber : W BLOCK 1
      OutData : STRINGDATA 'HELLO!!!'
      ErrCode : W BLOCK 1
      Out8Bytes : EQU 37B9 + 24B
      ...
        CALLG Out8Bytes, 2, DeviceNumber, OutData
        IF K GO ERROR
      ...
      ERROR : W1 =: ErrCode          %ErrorCode in W1 register.
    octal_definition: 37B9 + 24B
  mac:
    available: true
    code: |-
      LDT DEVNO          %Logical device address.
      LDD BYTES          %First 4 bytes to be written.
      LDX BYTES+2        %Next 2 bytes to be written.
      COPY SX DL
      LDX BYTES+3        %Last 2 bytes to be written.
      MON 24             %Monitor call Out8Bytes.
      JMP ERROR          %Error return from monitor call.
      ...
      ERROR, ...         %Error number in register A.
      ...
      DEVNO, ...
      BYTES, 'HELLO!!!'



      | ND-100 and ND-500 | All users | All programs |
    mon_number: 24
compatibility:
  nd100: true
  nd500: true
  user_programs: false
  rt_programs: false
  system_programs: false
source:
