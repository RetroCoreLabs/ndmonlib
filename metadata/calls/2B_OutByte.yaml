extraction:
  date: '2025-01-06'
  version: '1.0'
  validated: false
  ocr_corrected: false
emulation:
  status: implemented
  nd500x_handler: nd500x/src/libmon/handlers/mon_2B_OutByte.c
  last_updated: '2026-07-17'

  parameter_notes:
    - name: DeviceNumber
      note: >-
        32-bit word (ND-500 INTEGER = W). Routed by device class: character device
        or terminal -> console; mass-storage file -> open-file table with the byte
        pointer incremented (the manual's "The pointer to the next byte is
        incremented when writing to mass-storage"); anything else -> error 24.
      verified: true
    - name: OutputValue
      note: 'Read as a 32-bit word; only the low 8 bits are written.'
      verified: true

  return_contract:
    success: 'K flag cleared.'
    errors:
      - code: 24
        octal: 030B
        meaning: 'No such device name (unsupported device class)'
      - code: 90
        octal: 132B
        meaning: 'No file opened with this number'
      - code: 124
        octal: 174B
        meaning: 'Illegal parameter (file not open for writing, or host write error)'
      - code: 111
        octal: 157B
        meaning: 'Missing parameter (fewer than 2 CALLG args)'

  verified:
    - claim: >-
        The device model is shared with 1B: device 1 = own terminal, files are
        numbered separately. See the device_model block on 1B_InByte.yaml - it is
        recorded once there rather than duplicated.
      evidence: >-
        Same is_character_device()/is_terminal()/is_mass_storage_file() routing in
        nd500x/src/libmon/handlers/mon_2B_OutByte.c.
    - claim: 'The real SINTRAN error codes are used, not invented ones.'
      evidence: >-
        Commit 6b57202 swept the invented 52/53/55/57 out of every handler and
        replaced them from the Appendix A table
        (nd500x/src/libmon/mon_errors.h).

  unverified:
    - >-
      NO OBSERVED CALLER. Neither NC, CAT-500 nor the ND linker has been traced
      issuing 2B - they use 504B DVOUTS / 162B OUTST, exactly as the manual advises
      ("You are advised to use the faster OutputString on the ND-500"). So this
      handler is implemented but NOT proven end to end.
    - >-
      The manual's "The program waits if the output buffer of the device is full" is
      NOT modelled: nd500x has no output buffer and never waits on write. See 67B
      OutBufferSpace, which always reports free space for the same reason.
    - >-
      Word-oriented devices ("if the device is a word-oriented device, one word is
      written") are not modelled; nd500x always writes one byte.

  sources:
    - doc: 'SINTRAN III Monitor Calls (ND-860228.2 EN)'
      note: 'The manual body of this YAML.'
