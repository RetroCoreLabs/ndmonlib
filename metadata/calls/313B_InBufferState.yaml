emulation:
  status: verified
  nd500x_handler: nd500x/src/libmon/handlers/mon_313B_InBufferState.c
  last_updated: '2026-07-17'

  health_note: >-
    313B IBRISZ IS PROVEN HEALTHY. It returns the count, it writes its OUT
    parameter(s), AND it sets W1 - and the carve confirms it reports the TERMINAL
    input ring. If you are hunting a blocker, it is not here. This is recorded
    explicitly because 313B sat under suspicion during the linker investigation and
    was cleared.

  parameter_notes:
    - name: NoInBuffer
      note: >-
        Returned THREE ways, and all three matter: in W1 (which is what the ND linker
        actually reads), and written to CALLG arg 1 as a 32-bit word. The linker uses
        the 2-arg form IBRISZ(device = 1, &NoInBuffer).
      verified: true
    - name: NoUntilBreak
      note: >-
        Only written in the 3-arg form. nd500x returns the SAME value as NoInBuffer,
        reasoning that its queued input is line-oriented and CR-terminated, so a break
        is present whenever there is any input. That equality is a MODEL, not a carved
        behaviour.
      verified: false

  observed_calls:
    - caller: 'ND linker (linker-b01.dom) @0xB004DA8F'
      params:
        DeviceNumber: 1
      expectation: >-
        The linker calls IBRISZ at startup to poll whether a command is waiting, then
        reads its input-buffer length FROM W1 immediately after the CALLG
        (0xB004DA8F -> W1 =: b.68) and uses it as the command-line length.
      note: >-
        THE W1 RETURN IS LOAD-BEARING. Without it W1 keeps the leftover CALLG target
        address 0xF80000CB, which the linker takes as a length of ~4.29e9, walks off
        the end of its command buffer and takes a protection violation. Writing only
        the OUT parameter is NOT enough. Commit fc3ac5b.

  return_contract:
    success: 'K flag cleared; count in W1 and in the OUT parameter(s).'
    errors: []

  verified:
    - claim: >-
        The carved contract: arg0 is the logical device number; the call returns
        NoInBuffer = characters currently held in the TERMINAL INPUT RING, and
        NoUntilBreak = characters before the next break (0 if no break, BRKMAX-limited).
        Terminals walk the input ring; TAD and internal-buffer devices take other
        paths; FILES ARE NOT VALID HERE.
      evidence: >-
        Carve NDInsight/tools/sintran-segment-carver/versions/L-VSX-500/re/mon-analysis/313B-InBufferState/
        - IBRSIZ worker body at 025-S3IRPIT :110543B..110770B (byte offset 47814),
        real SINTRAN L bytes, structurally IBRSIZ: CALL GET0 / CALL GZTREG prologue,
        IOF ring scan, LBYT byte walk.
    - claim: 'GOTAB[313B] = 112164B - level-14 dispatch, byte-proven AND live-confirmed.'
      evidence: >-
        SINTRAN-DATA_commoncode :071546B (= GOTAB 071233B + 313), byte offset 59084 ->
        94 74 (big-endian 0x9474 = 112164B); matches a live read of the running
        system. The 112164B stub is real code (JMP I 10) whose pointer word 112174B
        reads 112247B, in 025-S3IRPIT at byte offset 49384 -> aa 08 cc 4d ba 07 ab 17.
    - claim: >-
        Reporting the remaining queued input length makes the linker's command reader
        proceed instead of blocking.
      evidence: >-
        Commit fc3ac5b - the ~4.29e9 length and its protection violation disappear.

  unverified:
    - >-
      THE DISPATCH-TO-WORKER LINK IS NOT PROVEN, and the carve says so plainly: on the
      static evidence GOTAB[313] resolves (via the 112164B stub) to 112247B, NOT to
      the 110543B IBRSIZ body. The final worker is register-loaded at runtime through
      a resident second-level / CALLPROC-style computed jump that is not present as a
      static pointer in ANY carved segment. The worker body is attached by structure
      and symbol (IBRSIZ / T2P06), and the carve marks that link MISATTRIBUTED.
    - >-
      nd500x's device and break accounting is MODELLED, NOT BYTE-EXACT (the handler
      says so). It ignores DeviceNumber entirely and reports
      mon_get_console_input_remaining() - the emulator's queued console input - as
      "the terminal input ring". It does not reject file numbers, which the carve
      says are not valid here.
    - >-
      NoUntilBreak == NoInBuffer is a modelling shortcut. The real call is BRKMAX-
      limited and returns 0 when there is no break; nd500x never returns a distinct
      value.

