emulation:
  status: stub
  nd500x_handler: nd500x/src/libmon/handlers/mon_321B_UEAdministrator.c
  last_updated: '2026-07-17'

  note: >-
    STUB - SAY SO. nd500x treats 321B as DEPRECATED: the handler does no work at
    all, logs "Deprecated MON call - returning error", and returns an error with
    the K flag set. It is registered MON_STATUS_DEPRECATED, a status invented for
    exactly this case (commit 9b0c904) because a MON_STATUS_NOT_IMPLEMENTED
    handler is short-circuited by the dispatcher and never runs, which left the
    error code at 0.

  parameter_notes:
    - name: '(none registered)'
      note: >-
        The nd500x registry declares 0 parameters for this call and the handler
        reads none. The real UEADM worker is carved and is a companion to 320B
        UELOG and 317B UECOM in the same User-Environment cluster, so it
        certainly takes arguments; nd500x simply never looks at them.
      verified: false

  observed_calls:
    - caller: 'NC C front-end (nc-a06.dom) - indirectly, via 312B MOINF'
      params: {}
      expectation: >-
        NC does not call 321B directly in the observed traces; it PROBES for it
        with 312B MOINF and branches at 0x08029092 / 0x0802909E on whether the
        entry is non-zero. If 312B reports 321B absent, NC skips building its
        list, walks a NULL and crashes at 0x080241FC. So 312B must report 321B
        PRESENT (MCTAB[321B] = 065453B) even though 321B''s own handler is a stub.
      note: >-
        This asymmetry is deliberate and is the single most confusing thing about
        this call in nd500x. See docs/NC_CRASH_0x08023EA4_ROOTCAUSE.md UPDATE 31
        and commit 2618145.

  return_contract:
    success: 'Never returned.'
    errors:
      - code: 124
        octal: 174B
        meaning: >-
          Illegal parameter. NOT a real UEADM error - it is the emulator''s way
          of saying "this call does nothing here". Returned unconditionally.

  verified:
    - claim: >-
        321B UEADM EXISTS in SINTRAN L07 and its worker is real carved code in
        003-S3CP, the same segment as its siblings UECOM / UELOG / SETOL.
      evidence: >-
        Carve L-VSX-500 321B-UEAdministrator/README.md, status "byte-verified
        (dispatch + worker body)". MCTAB slot (segment 044-S3IDPIT, byte offset
        2242) = 065453B = UEADM. Reproduced:
        dd if=044-S3IDPIT.bin bs=1 skip=2242 count=2 -> 6b 2b.
    - claim: 'A NOT_IMPLEMENTED handler is never called by the nd500x dispatcher.'
      evidence: >-
        Commit 9b0c904 and commit 5b6bdfd: "Do not register a handler
        MON_STATUS_NOT_IMPLEMENTED: mon_dispatch.c short-circuits that status and
        never calls it." That is why MON_STATUS_DEPRECATED exists - it lets the
        handler run and set a real error code.

  unverified:
    - >-
      "DEPRECATED" IS AN EMULATOR CLASSIFICATION, NOT A DOCUMENTED FACT. The
      carve shows the call is present and its worker is real code in this L07
      image. Nothing read so far says ND withdrew it. Treat the nd500x
      description "DEPRECATED: This MON call is no longer supported" as an
      emulator decision, not a manual statement.
    - >-
      The UEADM worker body IS carved (see 321B-UEAdministrator.ASM and
      .pseudo.c) but was not decoded for this note, so the real parameter list,
      functions and error codes are unread. An implementer should start there
      rather than from the emulator.
    - >-
      Nothing observed actually CALLS 321B - only 312B probes for it. So the
      stub''s error return has never been exercised by a real program, and
      whether NC would survive a real call is unknown.

  discrepancies:
    - was: >-
        Commit 9b0c904''s message says 321B returns "error 52" via the new
        DEPRECATED status.
      is: >-
        It returns 124 decimal (174B "Illegal parameter"). Error 52 was one of
        the INVENTED codes removed by commit 6b57202 - in SINTRAN''s real
        Appendix A table 52 means "No such friend", nothing to do with an
        unsupported call. The commit message predates the sweep and is stale.
      evidence: >-
        mon_321B_UEAdministrator.c uses MON_ERR_ILLEGAL_PARAMETER;
        src/libmon/mon_errors.h defines it as 124 (174B). Commit 6b57202: "52 ->
        ''No such friend'' (used for invalid parameter)".
    - was: >-
        Earlier carve version: the worker is "not-carved / name-only",
        "zero-filled", with GOTAB[321B] = 112376B vectoring to a diagnostic
        region DIA6.
      is: >-
        All of that was an artefact of the wrong dispatch model. MON calls go
        through MCTAB @ 005620B; MCTAB[321B] = 065453B = UEADM, and that worker
        IS carved in 003-S3CP. The old analysis read 065453B in
        SINTRAN-DATA_commoncode (zeros there - wrong overlay) and wrongly
        concluded "absent".
      evidence: >-
        Carve CORRECTED 2026-07-13 header in
        .../mon-analysis/321B-UEAdministrator/README.md;
        dd if=044-S3IDPIT.bin bs=1 skip=2242 count=2 -> 6b 2b.
    - was: >-
        nd500x reports 321B as non-existent through 312B MOINF, because
        DEPRECATED calls report as entry 0 by the agreed cross-emulator
        convention.
      is: >-
        312B carries an explicit hard-coded exception ABOVE the registry lookup
        that returns MCTAB[321B] = 065453B for this call, because NC requires it.
        So nd500x simultaneously says "present" (via 312B) and "unsupported"
        (via 321B itself). The 312B answer is the byte-true one.
      evidence: >-
        mon_312B_CheckMonCall.c lines 46-58; commit 2618145.

  sources:
    - doc: 'NDInsight/tools/sintran-segment-carver/versions/L-VSX-500/re/mon-analysis/321B-UEAdministrator/README.md'
      note: 'Byte-verified: MCTAB[321B] = UEADM = 065453B, worker carved in 003-S3CP. Start here to implement.'
    - doc: nd500x/docs/MON_CSHARP_SYNC_HANDOFF.md
      note: 'Line 63 - the 065453B value both emulators must return from 312B for this call.'
