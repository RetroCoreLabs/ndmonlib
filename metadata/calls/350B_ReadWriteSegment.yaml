  mac:
    available: true
    code: |-
      LDA (PARLI    % A = address of parameter list
      MON 350       % RWSEG
      % PARLI, (FUNC   % function: 0=read, 1=write, bit 17B set = physical memory
      %        SGBNK   % segment no. or memory bank no.
      %        ADDR    % address within segment or bank
      %        VALUE   % value to write (func=1) / value read (func=0)
    mon_number: 350
    notes: 'Only available for background programs on user SYSTEM.'
