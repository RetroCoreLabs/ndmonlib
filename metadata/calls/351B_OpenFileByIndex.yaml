    octal_definition: 37B9 + 351B
    notes: >-
      MON IOPEN is usable from ND-500/5000 programs (M-version pages 31-32); the
      release doc does not give an explicit ND-500 CALLG argument layout here.
  mac:
    available: true
    code: |-
      LDA  (INDEX
      COPY SA DD      % D = address of index list
      LDX  (FNAME     % X = address of file name buffer
      LDA  (FTYPE     % A = address of default file type buffer
      LDT  ACCES      % T = access mode
      MON  351        % IOPEN
      JMP  ERROR      % error return
      % normal return: A = open file number, D-buffer = resolved indexes
      % INDEX, 1       % MSB = directory index, LSB = user index
      %        2       % second word = file object index
      % FNAME, 'EXAMPL:SYMB'
      % FTYPE, 'DATA'
      % ACCES, 3
    mon_number: 351
    notes: ''
