octal: 3B
name: SetEcho
short_names:
- ECHOM
description: 'When you press a key on the terminal, a character is normally displayed. This is called
  echo. You modify a terminal''s echo with this monitor call.


  - If 8-bit I/O is set (TerminalFunction, function number 112), you will get echo always if bit 7 in
  the echo table is set.'
see_also:
- SetBreak
parameters:
- name: DeviceNumber
  type: INTEGER2
  io: I
  description: The terminal's logical device number. See appendix B. Only needed for RT programs. Background programs ignore this parameter. The user's terminal is assumed.
- name: EchoStrategy
  type: INTEGER2
  io: I
  description: 'Echo strategy: <0=No echo, 0=Echo all, 1=Echo except control chars, 2=MAC echo, 3-6=System defined, 7=User-defined table.'
- name: Table
  type: INTEGER2[8]
  io: I
  description: User-defined echo table (128 bits for ASCII chars). Only used when EchoStrategy=7. Bit 0 means echo that character.
examples:
  pascal:
    available: true
    code: 'DeviceNumber, EchoStrategy : INTEGER2;

      Table : RECORD...END;

      ...

      SetEcho(DeviceNumber, EchoStrategy, Table);'
  cobol:
    available: true
    code: "01 DeviceNumber COMP.\n01 EchoStrategy COMP.\n01 Table.\n  02 array COMP OCCURS 8 TIMES.\n\
      \  ...\nMONITOR-CALL \"SetEcho\" USING DeviceNumber, EchoStrategy, Table."
  fortran:
    available: true
    code: 'INTEGER DeviceNumber, EchoStrategy

      INTEGER Table(8)

      ...

      Monitor_Call(''SetEcho'', DeviceNumber, EchoStrategy, Table(1))'
  planc:
    available: true
    code: 'INTEGER : DeviceNumber, EchoStrategy

      INTEGER2ARRAY{0:7}

      ...

      Monitor_Call(''SetEcho'', DeviceNumber, EchoStrategy, Table(0))'
  assembly_500:
    available: true
    code: 'DeviceNumber : W BLOCK 1

      EchoStrategy : W BLOCK 1

      Table : H BLOCK 8

      SetEcho : EQU 37B9 + 3B

      ...

      CALLG SetEcho, 3, DeviceNumber, EchoStrategy, Table'
    octal_definition: 37B9 + 3B
  mac:
    available: true
    code: 'LDT DEVNO  %Logical device number.

      LDA STRAT  %Echo strategy.

      LDX (TABLE %Eight word large bit map.

      MON 3      %Monitor call SetEcho.

      ...

      DEVNO, ...

      STRAT, ...

      TABLE, ...

      *+10/ %Make a buffer of 8 words.



      '
    mon_number: 3
compatibility:
  manual_box:     # the manual's compatibility box, exact words
    machines: ND-100 and ND-500
    users: All users
    programs: All programs
  nd100: false
  nd500: false
  user_programs: true
  rt_programs: true
  system_programs: false
source:
  document: SINTRAN III Monitor Calls (ND-860228.2 EN)
  page: 441
  line: 20065
  scan_date: '2020'
  scanned_by: Jonny Oddene for Sintran Data
extraction:
  date: '2025-01-06'
  version: '1.0'
  validated: false
  ocr_corrected: false
emulation:
  status: implemented
  nd500x_handler: nd500x/src/libmon/handlers/mon_3B_SetEcho.c
  last_updated: '2026-07-17'

  echo_strategies:
    radix: decimal
    note: >-
      The strategy codes as nd500x implements them (mon_terminal_state.h /
      mon_503B_InputString.c should_echo_char_ex). Strategies 3-6 are a documented
      gap - see unverified.
    codes:
      - code: -1
        name: ECHO_STRAT_NONE
        description: 'Negative = no echo; characters are not displayed.'
        status: implemented
      - code: 0
        name: ECHO_STRAT_ALL
        description: 'Echo all characters.'
        status: implemented
      - code: 1
        name: ECHO_STRAT_NO_CONTROL
        description: 'Echo except control characters. nd500x tests ch >= 32 && ch < 127.'
        status: implemented
      - code: 2
        name: ECHO_STRAT_MAC
        description: 'MAC echo strategy - printable characters plus CR and LF.'
        status: implemented
      - code: 7
        name: ECHO_STRAT_USER
        description: 'User-defined 128-bit table read from the Table parameter (4 x 32-bit words).'
        status: implemented

  parameter_notes:
    - name: Table
      note: >-
        Read as 4 consecutive 32-bit words from arg_addresses[2] (128 bits) when
        strategy is 7. On ND-500 these are W, not H.
      verified: true
    - name: EchoStrategy
      note: 'Read as a signed 32-bit word - the strategy is meaningfully negative.'
      verified: true

  verified:
    - claim: >-
        THE ECHO TABLE HAS INVERTED SEMANTICS FROM THE BREAK TABLE: bit = 0 means
        ECHO, bit = 1 means DO NOT echo. (The break table is the natural way round:
        bit = 1 means break.) This is a real trap - the two 128-bit tables look
        identical and are not.
      evidence: >-
        nd500x/src/libmon/handlers/mon_503B_InputString.c
        should_echo_char_ex(): "INVERTED: bit=0 means echo, bit=1 means don't echo"
        -> return !bit_table_test_bit(user_table, ch); versus is_break_char_ex()
        -> return bit_table_test_bit(user_table, ch).
    - claim: >-
        The state 3B sets is REAL per-device state, consumed by the input calls: a
        later 503B DVINST / 511B DVIO with no per-call EchoStrat argument falls back
        to mon_get_echo_strategy(device).
      evidence: >-
        mon_503B_InputString.c mon_dvinst_read(): echo_strat = (ctx->arg_count > 5)
        ? read arg 5 : mon_get_echo_strategy(device_no).

  unverified:
    - >-
      STRATEGIES 3-6 (the manual's "system-defined tables") ARE NOT IMPLEMENTED.
      nd500x silently falls through to a PLACEHOLDER (echo all except control
      characters). The actual system tables are not in the scanned pages and no
      traced program selects 3-6.
    - >-
      Strategy 8 ("last user-defined table") is handled for BREAK (4B/503B) but
      there is no ECHO_STRAT_LAST_USER path proven by any caller.
    - >-
      The manual's note "If 8-bit I/O is set (TerminalFunction, function number 112),
      you will get echo always if bit 7 in the echo table is set" IS modelled in the
      503B input path (should_echo_char_ex, eight_bit_io && ch >= 128 -> test bit 7),
      but the 8-bit I/O flag itself is never set by any traced program, so that path
      has never executed.
    - >-
      NO OBSERVED CALLER. No traced program (NC, CAT-500, ND linker) issues 3B.
      Echo behaviour reaches the emulator instead through the per-call EchoStrat
      argument of 503B/511B.

  sources:
    - doc: 'SINTRAN III Monitor Calls (ND-860228.2 EN)'
      note: 'The manual body of this YAML.'
