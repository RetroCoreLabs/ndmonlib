octal: 40B
name: CloseSpoolingFile
short_names:
- SPCLO
description: 'Appends an opened file to a spooling queue. You specify a text to be printed on the error
  device when the file is to be printed.


  - If the file is not a spooling file, a normal close is performed.

  - Does not work for remote files. For these, a normal close is performed.'
see_also:
- CloseFile
- AppendSpooling
- '@DEFINE-SPOOLING-CONDITIONS'
parameters:
- name: FileNo
  type: INTEGER2
  io: I
  description: File number given when the file was opened.
- name: UserText
  type: STRING
  io: I
  description: Text to be output on the error device when printed.
- name: NoOfCopies
  type: INTEGER2
  io: I
  description: Number of print copies.
- name: PrintFlag
  type: INTEGER2
  io: I
  description: Print flag. 0=output text only if required by @DEFINE-SPOOLING-CONDITIONS, non-zero=print unconditionally.
examples:
  pascal:
    available: true
    code: 'FileNo, NoOfCopies, PrintFlag : INTEGER2;

      UserText : PACKED ARRAY [0..79] OF CHAR;

      ...

      CloseSpoolingFile(FileNo, UserText, NoOfCopies, PrintFlag);

      IF ErrCode <> 0 THEN ...'
  cobol:
    available: true
    code: "01 FileNo COMP.\n01 NoOfCopies COMP.\n01 PrintFlag COMP.\n01 UserText PIC X(100).\n01 ErrCode\
      \ COMP.\n...\nMONITOR-CALL \"CloseSpoolingFile\" USING FileNo, UserText,\n                     \
      \             NoOfCopies, PrintFlag.\n\nCALL \"CbError\" USING ErrCode.\nIF ErrCode NOT = 0 GO ..."
  fortran:
    available: true
    code: "INTEGER FileNo, NoOfCopies, PrintFlag\nCHARACTER UserText*80\n...\nMonitor_Call('CloseSpoolingFile',\
      \ FileNo, UserText(1:80),\n             NoOfCopies, PrintFlag)\nIF (ErrCode .NE. 0) THEN ..."
  planc:
    available: true
    code: "INTEGER : FileNo, NoOfCopies, PrintFlag\nBYTES : UserText(0:79)\n...\nON ROUTINEERROR DO\n\
      \  IF ErrCode > 0 THEN ...\nENDON\nMonitor_Call('CloseSpoolingFile', FileNo, UserText, NoOfCopies,\
      \ PrintFlag)"
  assembly_500:
    available: true
    code: |2-
      FileNo : W BLOCK 1
      NoOfCopies : W BLOCK 1
      PrintFlag : W BLOCK 1
      UserText : STRINGDATA 'Printing file...'
      ErrCode : W BLOCK 1
      CloseSpoolingFile : EQU 37B9 + 40B
      ...
        CALLG CloseSpoolingFile. 4, FileNo, UserText, NoOfCopies, PrintFlag
        IF K GO ERROR
        ...
      ERROR : W1 =: ErrCode                  %ErrorCode in W1 register.




      LDT FILNO                 %File number returned from earlier open.
      LDA NOCOP                 %Number of copies.
      COPY SA D0
      LDA FLAG                  %Condition flag.
      LDX (TEXT                 %Address of text to be sent to error device.
      MON 40                    %Monitor call CloseSpoolingFile.
      JMP ERROR                 %Error return from monitor call.
      ...                       %Normal return.
      ERROR, ...                %Error number in register A.
      ...
      FILNO, ...
      TEXT, 'GUMMED LABELS'     %Message when the file is to be printed.
      NOCOP, ...
      FLAG, 0                   %Text is only written if required by
                                % @DEFINE-SPOOLING-CONDITIONS.




