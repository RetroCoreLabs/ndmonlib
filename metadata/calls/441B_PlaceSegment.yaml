  assembly_500:
    available: true
    code: |-
      % ND-500/5000 CALLG form.
      CALLG 370000000441B,7,FILNAM,FILOFF,SIZE,LSEGNO,LTYPE,SHRINF,RETSEG
      % LSEGNO = 0 -> first free segment number is used
      % RETSEG receives the returned segment number
    octal_definition: 370000000441B
    notes: 'Equivalent to CALLG N500M function NEWPLACE (160B).'
  mac:
    available: false
