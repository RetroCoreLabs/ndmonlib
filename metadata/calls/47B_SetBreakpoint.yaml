# SINTRAN III Monitor Call: SetBreakpoint
# Octal: 47B
# Reverse-engineered from SINTRAN III NPL source + ND-860228-2-EN manual (section 2.14).
# The manual lists this call name-only (internal use); contract below is RE-derived.
octal: 47B
name: SetBreakpoint
short_names:
- SBRK
description: >-
  ND-100 debug monitor call: start a program to be debugged / set a breakpoint
  (manual section 2.14, short name SBRK). Part of the ND-100 debugger family
  (45/46/47/51) served by the DEBUGGER / BRPNT handler bodies. Internal-use call.
  Also listed in section 2.16 as a number no longer recommended.
notes:
- >-
    Internal-use monitor call (manual section 2.14); not intended for user programs.
- >-
    One of the ND-100 debugger MON calls 45/46/47/51; the requester's mapping ties
    47B (SBRK) to starting a program to be debugged. Also appears in manual section
    2.16 (numbers no longer supported).
- >-
    Two readable handler bodies serve the ND-100 debug MON calls: DEBUGGER
    (RP-P2-MONCALLS.NPL:2043), a 16-subfunction GOSW, and BRPNT (:1965), the
    breakpoint-trap handler. VERIFIED (labelled handler bodies read).
- >-
    UNCERTAIN - the exact MON-number -> handler binding for 45/46/47/51 is NOT in the
    NPL source tree; it lives in the absent monitor-level CALLPROC dispatch. Which of
    these numbers selects DEBUGGER versus BRPNT cannot be confirmed from source.
- >-
    DEBUGGER subfunctions (index in caller's T-register GOSW): 0 GETDSEG, 1 PLAC1,
    2 PSTART, 3 READLOC, 4 WRITLOC, 5 RELDSEG, 6 RTGDBSEG, 7 CHLGSEG, 8 RRGBLOCK,
    9 WRGBLOCK, 10 STRRT, 13 DWPERMIT, 14 DWPROTECT, 15 PLREENTRANT.
- >-
    Caller signature (CALLG/T-register contents) is unverified; no confirmed parameter
    block.
