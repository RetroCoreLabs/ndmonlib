  scan_date: '2020'
  scanned_by: Jonny Oddene for Sintran Data
extraction:
  date: '2025-01-06'
  version: '1.0'
  validated: false
  ocr_corrected: false
emulation:
  status: verified
  nd500x_handler: nd500x/src/libmon/handlers/mon_504B_OutputString.c
  last_updated: '2026-07-17'

  architecture_note: >-
    THE DVOUTS BODY IS SHARED, NOT DUPLICATED. mon_dvouts_write() in
    nd500x/src/libmon/handlers/mon_504B_OutputString.c is the core,
    exported via mon_device_io.h, and MON 511B DVIO calls the SAME function for its
    output phase. The carve/NPL side confirms SINTRAN is built the same way: DVIO
    SHARES ITS OUTPUT BODY WITH NOUTSTR (MON 504) - SUBR DVIO,NOUTSTR,OSTRS,PT5RST at
    MP-P2-N500.NPL:1688. So 511B == 504B DVOUTS followed by 503B DVINST on the same
    device.

  parameter_notes:
    - name: Buffer
      note: >-
        arg 2. Taken as a RAW BYTE ADDRESS (arg_addresses[2]) and read byte by byte -
        NOT a [Length][Pointer] descriptor. Contrast 162B OutString's 2-arg form,
        which IS a descriptor. Same index (2) in 511B DVIO.
      verified: true
    - name: NoOfBytes
      note: >-
        arg 1, a 32-bit word. Max 2048; a larger value is REJECTED with error 124
        (174B) - unlike 503B DVINST's MaxNo, which is clamped. Same index (1) in
        511B DVIO.
      verified: true
    - name: DeviceNo
      note: >-
        arg 0. Routed by class: character device / terminal -> console; mass-storage
        file -> open-file table (with fflush and position tracking); else error 24.
      verified: true

  observed_calls:
    - caller: 'ND linker (linker-b01.dom), thunk @0xB004ACA7, call @0xB004ACAD'
      params:
        arg_count: 3
      expectation: >-
        A bare pass-through thunk: ents $0x20; call $0xF8000144, $0x3, b.0x14, b.0x18,
        @b.0x1C - with exactly ONE caller that builds its arg block at a fixed +0x150
        and calls with ZERO CALLG args.
      note: >-
        This call site is load-bearing EVIDENCE for 511B: the 511B caller builds its
        args 0..2 with an instruction sequence BYTE-IDENTICAL to this one's, which is
        how 511B args 0..2 were proven to be DVOUTS' (DeviceNo, NoOfBytes, @Buffer).
    - caller: 'ND linker, via 511B DVIO'
      params:
        DeviceNo: 1
        NoOfBytes: 2
        Buffer: '0xB0049430'
      expectation: 'Writes the 2-byte prompt, after which the 503B DVINST phase reads a 12-byte line.'
      note: 'Runtime-verified in commit 2d9b00f.'

  return_contract:
    success: 'K flag cleared.'
    errors:
      - code: 124
        octal: 174B
        meaning: 'Illegal parameter (NoOfBytes > 2048, file not open for writing, or short host write)'
      - code: 24
        octal: 030B
        meaning: 'No such device name (unsupported device class)'
      - code: 90
        octal: 132B
        meaning: 'No file opened with this number'
      - code: 111
        octal: 157B
        meaning: 'Missing parameter (fewer than 3 CALLG args)'

  verified:
    - claim: 'The maximum string length is 2048 bytes.'
      evidence: >-
        The manual, corroborated from the NPL side: output byte count DNOBY, max 4000B
        octal = 2048 bytes (MP-P2-N500.NPL, recorded in 511B_DVIO.yaml).
    - claim: 'The output path works end to end against a real program.'
      evidence: >-
        Commit 2d9b00f: through 511B DVIO the linker's prompt is written
        ("504B DVOUTS wrote 2 bytes") and it proceeds to read its reply.
    - claim: >-
        DVOUTS is the right call to emulate WELL - it is the one real ND-500 programs
        actually use for output.
      evidence: >-
        The manual for both 2B OutByte ("You are advised to use the faster
        OutputString on the ND-500"), 24B Out8Bytes and 162B OutString ("For
        performance reasons, it is inadvisable to use this call from the ND-500. Use
        OutputString instead") all point here, and the traced programs bear it out -
        504B and 162B are the output calls actually observed.

  unverified:
    - >-
      Error 124 (174B Illegal parameter) for NoOfBytes > 2048 is a CHOICE, not a read
      value. The manual states the 2048 limit but not the code returned for exceeding
      it. (Note 503B's carve DOES byte-verify a 174B illegal-parameter path, which
      makes 174B plausible here - but that is inference from the sibling call, not
      proof for this one.)
    - >-
      The file-output path (writing DVOUTS to an open mass-storage file) is
      implemented but has NO observed caller; only the terminal path is trace-proven.
    - >-
      nd500x never blocks on output - there is no output buffer to fill.

  sources:
    - doc: 'SINTRAN III Monitor Calls (ND-860228.2 EN)'
      note: 'The manual body of this YAML.'
    - doc: NDInsight/tools/sintran-segment-carver/versions/L-VSX-500/re/mon-analysis/504B-OutputString/
      note: 'Carve folder for this call - NOT mined into this block; the facts above come from the handler, the call sites and the 511B evidence chain.'
