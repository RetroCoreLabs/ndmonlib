# SINTRAN III Monitor Call: AnswerSIBAS
# Octal: 506B
# Reverse-engineered from SINTRAN III NPL source (MP-P2-N500.NPL).
# The manual (section 2.14) lists this call name-only; contract below is RE-derived.

octal: 506B
name: AnswerSIBAS
short_names:
- 5SIBMO
- SIBSURV
description: >-
  Services a SIBAS-server request coming from the ND-500. Validates the SIBAS
  number, checks the SIBAS datafield reservation, arms the SIBAS timer, and either
  reactivates the SIBAS server or, when the SIBAS is set to a stopped state, stops
  it. Intended for ND subsystems only (SIBAS database system).
notes:
- Internal-use monitor call (manual section 2.14); not intended for user programs.
- Reverse-engineered from the level-12 handler 5SIBMO in MP-P2-N500.NPL:1967-1991.
- The parameters below are the ND-500 message-buffer fields read by the handler
  (service side). The caller-side CALLG signature is not documented and is
  UNVERIFIED.
- Dispatched via the ND-500 level-12 GOSW table, index = 506B - 500B = 6.
see_also:
- GetSIBASMessage
- AnswerSIBAS
parameters:
- name: SibasNumber
  type: INTEGER
  io: I
  description: >-
    SIBAS process number, read from message field SIBNO. Must be > 0 and
    <= MXSIBAS and reference an existing SIBAS datafield, else error EC174.
- name: Status
  type: INTEGER
  io: O
  description: >-
    Result: OK reactivates the SIBAS server; error 5 if the SIBAS datafield is
    reserved by another process; EC174 for an illegal SIBAS number.
