# SINTRAN III Monitor Call: DVIO
# Octal: 511B
# Reverse-engineered from SINTRAN III NPL source (MP-P2-N500.NPL).
# The manual does not document this call; contract below is RE-derived.
octal: 511B
name: DVIO
short_names:
- DVIO
description: >-
  ND-500 device I/O monitor call: outputs a prompt string to a terminal-class
  device and then reads an input string in a single combined operation. DVIO
  shares its output body with NOUTSTR (MON 504) and continues into the instring
  path, i.e. DVIO = combined OutString + InString. Intended for ND subsystems only.
notes:
- >-
    Internal-use ND-500 level-12 monitor call; not intended for user programs.
- >-
    Handler SUBR DVIO,NOUTSTR,OSTRS,PT5RST at MP-P2-N500.NPL:1688; the output body
    is shared with NOUTSTR (MON 504).
- >-
    Dispatched via the ND-500 level-12 GOSW table (L12MIN=500..L12MAX=523), slot
    index = 511B - 500B = 11 (octal 13); entered with X = current ND-500 message
    (N5MESSAGE) and B = ND-500 CPU datafield.
- >-
    UNVERIFIED - the values below are message-field offsets read by the handler, not
    a confirmed CALLG caller signature. Output datafield TODF, output byte count
    DNOBY (max 4000B octal = 2048 bytes); input phase reads 11DMA (max input bytes)
    and 11MXBRK (max chars before break).
- >-
    Write-back: AD =: X.11NOCHRET (number of returned bytes), 100000 =: X.NUMPAR
    (write-back mask) at MP-P2-N500.NPL:1900-1901.
see_also:
- OutputString
- InputString
parameters:
- name: OutputByteCount
  type: INTEGER
  io: I
  description: >-
    UNVERIFIED - message field DNOBY, number of prompt bytes to output
    (max 4000B octal = 2048 bytes). Message offset, not a confirmed CALLG parameter.
- name: MaxInputBytes
  type: INTEGER
  io: I
  description: >-
    UNVERIFIED - message field 11DMA, maximum number of input bytes to read.
    Message offset, not a confirmed CALLG parameter.
- name: ReturnedBytes
  type: INTEGER
  io: O
  description: >-
    UNVERIFIED - number of returned input bytes, written back to message field
    11NOCHRET. Message offset, not a confirmed CALLG parameter.
