# SINTRAN III Monitor Call: N500M (ND-500 Monitor Function)
# Octal: 60B
# Extracted from: ND-60.136.04A ND-500 Loader Monitor
#
# =============================================================================
# FOR NEWCOMERS TO NORSK DATA:
# =============================================================================
# The ND-500 is a 32-bit coprocessor that works alongside the 16-bit ND-100.
# The ND-500 handles heavy computation but has NO direct I/O capability.
# Every time the ND-500 needs to read a file, print something, or do any I/O,
# it must ask the ND-100 to do it through MON 60.
#
# Communication uses:
#   - 5MPM: Shared memory both CPUs can access (message buffers)
#   - TAG-IN: Signal FROM ND-500 TO ND-100 (ND-500 sends requests)
#   - TAG-OUT: Signal FROM ND-100 TO ND-500 (ND-100 sends responses)
#
# The TAG naming is from the 3022 interface card's perspective (in ND-100):
#   TAG-IN = what comes IN to the 3022 = from ND-500
#   TAG-OUT = what goes OUT of the 3022 = to ND-500
#
# See 60B_N500M_Hardware_Mapping.md for detailed TAG explanations.
# =============================================================================

octal: 60B
name: N500M
short_names:
  - ND500Function
  - N500MON

description: |
  ND-500 Monitor Function - The primary way ND-100 programs control the ND-500.

  SIMPLE EXPLANATION:
  MON 60 lets programs on the ND-100 (the main computer) control the ND-500
  (a fast coprocessor). It's like a remote control for the ND-500.

  TECHNICAL DETAILS:
  This monitor call provides 67 subfunctions (0B through 142B octal) for:
  - ND-500 register and memory access
  - Process management and control
  - Control store (microcode) operations
  - Memory configuration
  - Histogram and logging
  - Domain management

  The ND-500 Monitor is divided into three parts, ALL running on ND-100:
  1. Part 1: Runs on page table 2 as subsystem "ND-500-MONITOR" (user interface)
  2. Part 2: Runs on page table 0 (kernel, handles the actual work)
  3. Part 3: ND-500 driver routine in resident memory (talks to hardware)

  COMMUNICATION FLOW:
  When ND-500 needs something from ND-100:
  1. ND-500 writes request to shared memory (5MPM)
  2. ND-500 signals via TAG-IN (code 8 = "I have a request")
  3. ND-100 processes the request
  4. ND-100 writes results to shared memory
  5. ND-100 signals via TAG-OUT (code 16 = "Done!")
  6. ND-500 reads results and continues

  MON 60 uses Fortran-style parameter passing: the A-register points to a
  parameter address list where the first word is the function code and
  remaining parameters are 32-bit words or arrays.

notes:
  - "Version history: MON 60 (N500M) gained function 174B (LOIMM) to support the new ND-5830 and ND-5850 ND-5000 system types (SINTRAN-III-Release-History.md:458, table 4.2 - placed in the M-version column). UNVERIFIED: the release documentation names function 174B / LOIMM but gives no argument layout for it, so its parameter contract is not recorded here."
  - "First parameter is always the 16-bit function code"
  - "Remaining parameters depend on the function code"
  - "Skip return indicates successful completion"
  - "Direct return indicates an error occurred"
  - "See 60B_N500M_Functions.md for complete subfunction reference"
  - "Function codes range from 0B to 142B (octal)"

see_also:
  - "@ND-500-MONITOR command"
  - "MON 407B (TPSTRA) - Returns stop reason from RUNN"
  - "60B_N500M_Functions.md - Complete subfunction reference"

references:
  - "ND-60.136.04A ND-500 Loader Monitor (Chapter 10, pp. 192-195)"
  - "ND-860228-2-EN SINTRAN III Monitor Calls (line 2601)"

parameters:
  - name: FunctionCode
    type: INT
    io: I
    description: "Subfunction code (0B-142B). See 60B_N500M_Functions.md for complete list."

  - name: Parameters
    type: VARIES
    io: IO
    description: "Function-specific parameters. Can be 32-bit words, arrays, or strings depending on function code."

  - name: ErrorCode
    type: INT
    io: O
    description: "Error code returned on direct return. 0 = success."
    implicit: true

