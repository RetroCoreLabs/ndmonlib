    description: "Read program memory"
    params: "<no.of bytes> <ND-500 addr> <data area> <bytes returned>"

  - code: 3B
    name: RDATA
    description: "Read data memory"
    params: "<no.of bytes> <ND-500 addr> <data area> <bytes returned>"

  - code: 4B
    name: WPROG
    description: "Write program memory"
    params: "<no.of bytes> <ND-500 addr> <data area>"

  - code: 5B
