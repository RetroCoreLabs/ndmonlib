examples:
  mac:
    available: true
    code: |
      ; Example: Read ND-500 register
              LDA    (PARAMS        ; A-register points to parameter list
              MON    60             ; Monitor call N500M
              JMP    ERROR          ; Direct return = error
              ...                   ; Skip return = success

      PARAMS, 0                     ; Function code 0B = RRREG
              REGNUM                ; Register number
              REGVAL                ; Where to store value

      ; Example: Reserve ND-500 process (function 15B)
              LDA    (RESRVP
              MON    60
              JMP    ERROR
              ...

      RESRVP, 15                    ; Function code 15B = RESRV
              STADDR                ; Start address after escape
              VERSTR                ; Version string pointer
    mon_number: 60
    notes: "A-register points to parameter list. First word is function code."

  assembly_500:
    available: true
    code: |
      ; ND-500 assembly - calling MON 60 via Segment 31 trap
      ; Note: ND-500 programs use segment 31 traps which are
      ; forwarded to ND-100 for MON 60 processing

      FUNCCODE : W BLOCK 1
      PARAMS   : W BLOCK 10
      N500M    : EQU 37B9 + 60B

      ; Example: Read register
              LDW W0, =0B           ; Function code RRREG
              STW W0, FUNCCODE
              LDW W1, =5            ; Register number
              STW W1, PARAMS
              CALLG N500M, 2, FUNCCODE, PARAMS
              IF K GO ERROR
              ; Register value now in PARAMS+1
    octal_definition: "37B9 + 60B"
    notes: "ND-500 monitor calls trap to ND-100 via segment 31"

  fortran:
    available: true
    code: |
      C     Example: Reserve ND-500 process
            INTEGER*2 FUNCCODE
            INTEGER*4 STARTADDR
            CHARACTER*16 VERSION

            FUNCCODE = 15           ! Function 15B = RESRV
            STARTADDR = 0
            VERSION = 'PTO V1.0'

            CALL MONITOR_CALL('N500M', FUNCCODE, STARTADDR, VERSION)
            IF (ERRCODE .NE. 0) THEN
                ! Handle error
            ENDIF
    notes: "Parameters depend on function code"

  planc:
    available: true
    code: |
      INTEGER : FUNCCODE
      INTEGER4 : STARTADDR
      BYTES : VERSION(0:15)

      ON ROUTINEERROR DO
          IF ErrCode > 0 THEN
              % Handle error
          ENDON
      ENDON

      % Reserve ND-500 process
      FUNCCODE := 15B              % RESRV
      STARTADDR := 0
      VERSION := 'PTO V1.0'
      Monitor_Call('N500M', FUNCCODE, STARTADDR, VERSION)
    notes: "Parameters depend on function code"

compatibility:
  platforms:
    nd100: true
    nd500: false  # Called FROM ND-100 to control ND-500

  users:
    - "User RT"
    - "User SYSTEM"
    - "ND-500-MONITOR subsystem"

  programs:
    - "System programs"
    - "RT programs with appropriate privileges"

  notes: |
    MON 60 runs on ND-100 only. It provides the interface for ND-100
    programs to control and communicate with the ND-500 coprocessor.
    Most functions require User SYSTEM or special privileges.

errors:
  returns_error: true

  error_codes:
    - code: 1
      description: "Illegal function code"
    - code: 2
      description: "ND-500 not present"
    - code: 3
      description: "ND-500 not available"
    - code: 4
      description: "Process not reserved"
    - code: 5
      description: "Invalid parameter"

  error_reference: "See ND-60.136.04A Chapter 10 for complete error list"

