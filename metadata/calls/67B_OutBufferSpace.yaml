emulation:
  status: stub
  nd500x_handler: nd500x/src/libmon/handlers/mon_67B_OutBufferSpace.c
  last_updated: '2026-07-17'

  stub_behaviour: >-
    RETURNS A CONSTANT - SAY SO. 67B OSIZE always answers 2048 free bytes
    (DEFAULT_BUFFER_SIZE) for any legal device, regardless of how much has been
    written. nd500x has NO output buffer at all: 2B/24B/162B/504B write straight
    through to the console and never block, so there is no free-space figure to
    report and nothing the answer could be measured against. A program that polls
    67B to pace its output will see infinite space and never throttle - which is
    harmless here precisely because writes never block.

  parameter_notes:
    - name: NoOfBytes
      note: >-
        Returned in W1/I1 via ctx->set_i1 AND, if a second CALLG argument is present,
        written to it as a 32-bit word. The manual documents the I1 return; the OUT
        parameter write is defensive.
      verified: false

  return_contract:
    success: 'K flag cleared; NoOfBytes in I1 (always 2048).'
    errors:
      - code: 124
        octal: 174B
        meaning: 'Illegal parameter (a file number was passed)'
      - code: 111
        octal: 157B
        meaning: 'Missing parameter (no CALLG args)'

  verified:
    - claim: 'File numbers are rejected.'
      evidence: 'is_mass_storage_file(device_no) -> error 124 (174B) in mon_67B_OutBufferSpace.c.'

  unverified:
    - >-
      THAT 2048 IS A PLAUSIBLE FIGURE. It is nd500x's own DEFAULT_BUFFER_SIZE, not a
      real SINTRAN buffer size read from anywhere. The real per-device output buffer
      size is not in the scanned pages.
    - >-
      THE CARVE WAS NOT MINED FOR THIS ENTRY. A carve folder exists at
      NDInsight/tools/sintran-segment-carver/versions/L-VSX-500/re/mon-analysis/067B-OutBufferSpace/
      and has NOT been read into this block. It may well carry the real buffer
      accounting.
    - >-
      The manual says "This monitor call is not available for internal devices."
      nd500x does not model internal devices and so cannot reject them; it rejects
      only file numbers. The error code for the internal-device case is unknown.
    - >-
      Error 124 (174B) for the file-number case is a CHOICE, not a read value.
    - >-
      NO OBSERVED CALLER. No traced program issues 67B.

  sources:
    - doc: 'SINTRAN III Monitor Calls (ND-860228.2 EN)'
      note: 'The manual body of this YAML.'
