# Base MkDocs configuration for the MON call documentation site.
# The pages and the navigation are generated by tools/generate_mon_site.py
# into build-site/, whose mkdocs.yml inherits this file:
#   python3 tools/generate_mon_site.py
#   mkdocs build -f build-site/mkdocs.yml
site_name: ndmonlib - SINTRAN III MON calls
site_description: Reference and implementation status of the SINTRAN III monitor calls emulated by ndmonlib
site_url: https://retrocorelabs.github.io/ndmonlib/
repo_url: https://github.com/RetroCoreLabs/ndmonlib
repo_name: RetroCoreLabs/ndmonlib
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/extra.css
extra_javascript:
  - https://cdn.jsdelivr.net/npm/tablesort@5.3.0/dist/tablesort.min.js
  - https://cdn.jsdelivr.net/npm/tablesort@5.3.0/dist/sorts/tablesort.number.min.js
  - assets/tablesort.js
